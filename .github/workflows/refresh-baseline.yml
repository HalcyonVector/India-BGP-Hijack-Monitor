name: Daily baseline refresh

on:
  schedule:
    - cron: "7 3 * * *"   # 03:07 UTC daily -- offset from :00 to avoid the
                          # documented GitHub Actions on-the-hour delay
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python db/store.py

      - name: Build baseline against live RIPEstat
        run: python backend/detector/baseline.py

      - name: Verify detection logic still passes against the fresh baseline
        run: python backend/detector/test_detection_logic.py

      - name: Write a committable summary (the SQLite DB itself is gitignored)
        run: |
          python - <<'PY'
          import json, sqlite3, time
          conn = sqlite3.connect("db/bgp_monitor.db")
          conn.row_factory = sqlite3.Row
          rows = conn.execute(
              "SELECT asn, COUNT(*) c FROM baseline_prefixes GROUP BY asn ORDER BY asn"
          ).fetchall()
          summary = {
              "generated_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "total_prefixes": sum(r["c"] for r in rows),
              "per_asn": {str(r["asn"]): r["c"] for r in rows},
          }
          with open("docs/baseline-summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2))

          # Append to the history the drift endpoint reads (a plain file, so
          # the deployed app needs no GitHub API calls). ~200 bytes a day.
          try:
              with open("docs/baseline-history.json") as f:
                  history = json.load(f)
          except FileNotFoundError:
              history = []
          history.append(summary)
          with open("docs/baseline-history.json", "w") as f:
              json.dump(history, f, separators=(",", ":"))
              f.write("\n")
          PY

      - name: Commit updated baseline summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/baseline-summary.json docs/baseline-history.json
          git diff --cached --quiet && echo "no change, skipping commit" || git commit -m "chore: refresh baseline summary"
          # Retry the push: on 2026-11-04 a GitHub Git Operations outage failed
          # this step after the baseline had built and passed its tests.
          for attempt in 1 2 3 4; do
            git push && exit 0
            [ "$attempt" = 4 ] && break
            wait=$((30 * 2 ** (attempt - 1)))
            echo "push failed (attempt $attempt of 4), retrying in ${wait}s"
            sleep "$wait"
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort 2>/dev/null; true; }
          done
          echo "push failed after 4 attempts"
          exit 1
