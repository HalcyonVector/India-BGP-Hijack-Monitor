name: Weekly RPKI coverage refresh

on:
  schedule:
    - cron: "13 4 * * 1"   # 04:13 UTC every Monday -- offset from :00 to
                           # avoid the documented GitHub Actions on-the-hour delay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python db/store.py

      - name: Build baseline (rpki_coverage.py samples from it)
        run: python backend/detector/baseline.py

      - name: "Sample RPKI coverage per ASN (~5 min, rate-limited)"
        run: python backend/detector/rpki_coverage.py

      - name: Write a committable summary
        run: |
          python - <<'PY'
          import json, sqlite3, time
          conn = sqlite3.connect("db/bgp_monitor.db")
          conn.row_factory = sqlite3.Row
          rows = conn.execute("SELECT * FROM rpki_coverage ORDER BY asn").fetchall()
          summary = {
              "generated_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "per_asn": {
                  str(r["asn"]): {
                      "sample_size": r["sample_size"],
                      "covered_count": r["covered_count"],
                      "covered_pct": round(r["covered_count"] / r["sample_size"] * 100, 1)
                      if r["sample_size"] else None,
                  }
                  for r in rows
              },
          }
          with open("docs/rpki-coverage-summary.json", "w") as f:
              json.dump(summary, f, indent=2)
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit updated RPKI coverage summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rpki-coverage-summary.json
          git diff --cached --quiet && echo "no change, skipping commit" || git commit -m "chore: refresh RPKI coverage summary"
          # Retry the push so a short GitHub outage doesn't fail the whole run
          # (same fix as refresh-baseline.yml, after the 2026-11-04 outage).
          for attempt in 1 2 3 4; do
            git push && exit 0
            [ "$attempt" = 4 ] && break
            wait=$((30 * 2 ** (attempt - 1)))
            echo "push failed (attempt $attempt of 4), retrying in ${wait}s"
            sleep "$wait"
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort 2>/dev/null; true; }
          done
          echo "push failed after 4 attempts"
          exit 1
