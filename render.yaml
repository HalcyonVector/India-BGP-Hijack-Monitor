services:
  - type: web
    name: india-bgp-hijack-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    # CI commits data to docs/ up to five times a day, and GitHub Pages
    # serves the frontend. Neither needs a new API build, and each build
    # counts against the free tier's monthly build minutes.
    buildFilter:
      ignoredPaths:
        - docs/**
        - frontend/**
        - scripts/**
        - .github/**
        - "**/*.md"
    envVars:
      - key: RUN_MONITOR_INLINE
        value: "1"
      - key: RUN_RPKI_REFRESH_INLINE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
